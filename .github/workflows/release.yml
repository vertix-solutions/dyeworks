name: Release

# Publishes to the public npm registry by trusted publishing (OIDC): no token in any file or secret.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build, test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url here: setup-node would write an .npmrc with a placeholder token, and npm then
      # sends that instead of exchanging the OIDC token, which the registry rejects as a 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm --version
      - name: The tag names the package's version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
