<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" preserveAspectRatio="xMidYMid slice">
<!-- aurora backdrop fallback. Mirrors the aurora Tokens bg (#0a1020) for the night field, accent (#5cf2b4) for
     the curtains at 7 % alpha at most and theme-second (#b28cff) for their violet hems; the stars are dim
     points of fg (#e8f1ff) at 25 % alpha. All light stays in the top band and the frame stays near bg.
     Token names are written without their leading dashes, which an XML comment cannot hold. -->
<defs>
<linearGradient id="curtain" x1="0" y1="0" x2="0" y2="460" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#b28cff" stop-opacity="0.05"/>
<stop offset="0.45" stop-color="#5cf2b4" stop-opacity="0.07"/>
<stop offset="1" stop-color="#5cf2b4" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0d1530"/>
<stop offset="1" stop-color="#0a1020"/>
</linearGradient>
</defs>
<rect width="1536" height="1024" fill="url(#sky)"/>
<path d="M0 60C220 20 380 140 600 90S1000 10 1200 80 1460 60 1536 40V380C1380 300 1220 420 1000 340S620 260 420 360 120 300 0 340Z" fill="url(#curtain)"/>
<path d="M180 0C400 60 560 10 760 70S1120 40 1340 0H1536V200C1300 260 1120 160 900 230S520 260 300 180 120 220 0 200V0Z" fill="url(#curtain)"/>
<g fill="#e8f1ff" fill-opacity="0.25">
<circle cx="96" cy="140" r="1.4"/><circle cx="310" cy="420" r="1.2"/><circle cx="520" cy="210" r="1.5"/>
<circle cx="742" cy="480" r="1.1"/><circle cx="930" cy="150" r="1.3"/><circle cx="1110" cy="390" r="1.4"/>
<circle cx="1290" cy="230" r="1.2"/><circle cx="1460" cy="470" r="1.5"/><circle cx="210" cy="620" r="1"/>
<circle cx="1380" cy="640" r="1"/><circle cx="660" cy="660" r="1"/>
</g>
</svg>
