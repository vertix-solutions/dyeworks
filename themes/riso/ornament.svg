<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
<!-- riso ornament fallback: two overlapping circles printed in two inks. The left mirrors the riso Tokens accent
     (#c0185f), the right theme-second (#1f56c8), and their overlap the dark violet (#3a1a5e) the two inks make
     when overprinted. Token names are written without their leading dashes, which an XML comment cannot hold. -->
