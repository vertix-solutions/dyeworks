<path d="M118 100C130 94 144 96 152 100M150 114C162 108 174 110 182 114" fill="none" stroke="#0b6e78" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
<g fill="#86a6ab" stroke="#4c6669" stroke-width="2">
