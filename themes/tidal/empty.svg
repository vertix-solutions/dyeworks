<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
<!-- tidal empty fallback, shared by both Schemes: an empty tide pool seen from above, a ring of rounded rocks
     around still water with nothing in it. Mirrors the tidal Tokens theme-second (#2aa8a0) for the water at 25 %
     alpha, the day accent (#0b6e78) for its rim line and muted greys (#86a6ab, #4c6669) for the rocks.
     Token names are written without their leading dashes, which an XML comment cannot hold. -->
